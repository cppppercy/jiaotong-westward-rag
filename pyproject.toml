[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jiaotong-westward-rag"
version = "0.1.0"
description = "A citation-grounded RAG assistant for the history of Jiaotong University's westward relocation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.39,<2",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
  "jieba>=0.42,<1",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=3.1,<6",
  "numpy>=2.1,<3",
  "pypdf>=5,<7",
  "pandas>=2.2,<4",
  "socksio>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "reportlab>=4.2,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
